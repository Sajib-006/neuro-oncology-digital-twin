# Pinned to the environment used for the paper (Python 3.11.16 on Linux).
# Create with:  conda env create -f environment.yml   (or mamba)
# System tools, not installed here: pdftotext (poppler 22.02.0, devices stage only),
# Google Chrome or Chromium (Figure 5 only), curl and sha256sum (download scripts).
name: brain-tumor-ai-review
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=2.2.6
  - pandas=2.3.3
  - matplotlib=3.9.2
  - scipy=1.14.1
  - pip
  - pip:
      - pyarrow==17.0.0
      - statsmodels==0.14.4
      - scikit-learn==1.5.2
      - openpyxl==3.1.5
      - pillow==12.3.0
